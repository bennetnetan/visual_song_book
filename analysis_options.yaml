# Visual Song Book — analyzer configuration.
#
# Baseline: package:flutter_lints (which itself includes the core and
# recommended lint sets) plus an explicit set of additional rules below.
# Run `flutter analyze` to verify: the project baseline is zero issues.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - '**/*.g.dart'
    - tool/**
    - android/**
    - ios/**
    - web/**
    - windows/**
    - macos/**
    - linux/**

linter:
  rules:
    # Additional lints beyond the flutter_lints default set.
    prefer_single_quotes: true
    unnecessary_late: true
    use_colored_box: true
    use_decorated_box: true
    use_full_hex_values_for_flutter_colors: true
