name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            mdbtools

      - name: Check formatting (non-blocking)
        run: dart format --output=none --set-exit-if-changed lib test tool
        continue-on-error: true

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    needs: analyze-test
    strategy:
      fail-fast: false
      matrix:
        include:
          # Flutter puts each desktop bundle in an architecture-specific
          # folder, and the Windows/macOS layouts differ from Linux. These
          # `path` values are the real output locations — the previous
          # `build/<name>/release/bundle` form never matched, so the
          # artifacts silently uploaded nothing.
          - os: ubuntu-latest
            name: linux
            command: flutter build linux --release
            path: build/linux/x64/release/bundle
          - os: windows-latest
            name: windows
            command: flutter build windows --release
            path: build/windows/x64/runner/Release
          - os: macos-latest
            name: macos
            command: flutter build macos --release
            # Flutter writes ephemeral/.app_filename with the real bundle name,
            # which is the pub project name — not the Xcode target name, so it
            # is visual_song_book.app and not Runner.app.
            path: build/macos/Build/Products/Release/visual_song_book.app
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            mdbtools

      - name: Build
        run: ${{ matrix.command }}

      # Fails loudly with a useful message if Flutter ever moves its output
      # layout again, which the old silent artifact upload would have hidden.
      - name: Verify build output exists
        shell: bash
        run: |
          target="${{ matrix.path }}"
          if [ ! -d "$target" ]; then
            echo "::error::Expected build output at '$target' but it does not exist."
            echo "Flutter's desktop output layout changed — update the matrix paths."
            ls -R build 2>/dev/null | head -40
            exit 1
          fi

      # Archives are created on the platform that produced them. A macOS .app
      # is full of symlinks (in Frameworks/), and copying one through a Linux
      # runner risks breaking them — so it is tarred where it was built.
      - name: Package Linux build
        if: matrix.name == 'linux'
        run: tar -czf "$RUNNER_TEMP/visual_song_book-linux-x64.tar.gz" -C "${{ matrix.path }}" .

      - name: Package Windows build
        if: matrix.name == 'windows'
        shell: pwsh
        run: |
          Compress-Archive -Path "${{ matrix.path }}/*" `
            -DestinationPath "$env:RUNNER_TEMP\visual_song_book-windows-x64.zip" `
            -Force

      - name: Package macOS build
        if: matrix.name == 'macos'
        run: tar -czf "$RUNNER_TEMP/visual_song_book-macos.tar.gz" -C "${{ matrix.path }}" .

      - name: Upload archive
        if: matrix.name != 'android'
        uses: actions/upload-artifact@v4
        with:
          name: package-${{ matrix.name }}
          path: ${{ runner.temp }}/visual_song_book-*
          if-no-files-found: error

  # The Android build gets its own runner. It shares none of the disk pressure
  # of the release job, which downloads every other artifact and re-archives
  # them — that job previously ran out of space mid-Gradle-build when it also
  # compiled the APK.
  android:
    needs: analyze-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # Android SDK, NDK and Gradle caches are large; reclaim what the runner
      # image does not need before building so this does not run the release
      # runner's disk dry.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/local/lib/android/sdk/ndk/{*,.*} 2>/dev/null || true
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup 2>/dev/null || true
          df -h /

      - name: Build APK (release)
        run: flutter build apk --release

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: package-android
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error

  # Inno Setup only runs on Windows, so the installer is compiled on a Windows
  # runner and shipped as the artifact the release job publishes.
  windows-installer:
    needs: build
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup -y --no-progress

      - name: Build Windows release bundle
        run: flutter build windows --release

      - name: Download VC++ redistributable
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path installer/windows/redist |
            Out-Null
          Invoke-WebRequest `
            -Uri https://aka.ms/vs/17/release/vc_redist.x64.exe `
            -OutFile installer/windows/redist/vc_redist.x64.exe
          Write-Host "Downloaded $((Get-Item installer/windows/redist/vc_redist.x64.exe).Length) bytes"

      - name: Resolve app version from pubspec
        id: version
        shell: pwsh
        run: |
          $raw = (Select-String -Path pubspec.yaml `
            -Pattern '^version:\s*(\S+)' | Select-Object -First 1).Matches[0].Groups[1].Value
          $version = $raw.Split('+')[0]
          Write-Host "App version: $version"
          "version=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Compile installer
        shell: pwsh
        run: |
          $iscc = @(
            'C:\Program Files (x86)\Inno Setup 6\ISCC.exe',
            'C:\Program Files\Inno Setup 6\ISCC.exe',
            'ISCC.exe'
          ) | Where-Object {
            ($_ -eq 'ISCC.exe') -or (Test-Path -LiteralPath $_)
          } | Select-Object -First 1

          if (-not $iscc) { throw 'ISCC.exe was not found after installing Inno Setup.' }

          & $iscc `
            "/DMyAppVersion=${{ steps.version.outputs.version }}" `
            "/DMyAppSourceDir=${{ github.workspace }}\build\windows\x64\runner\Release" `
            installer/windows/setup.iss

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: dist/*.exe
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, windows-installer, android]
    runs-on: ubuntu-latest
    # No toolchain needed: every asset arrives as an artifact.
    steps:
      - uses: actions/checkout@v4

      # NOTE: Android release builds currently use Flutter's default debug
      # signing. Configure a keystore and wire up signConfig + the
      # ANDROID_SIGNING_KEY/STOREPASS secrets to produce a signed APK/AAB.
      # The APK itself is built by the `android` job so this one never compiles
      # anything and cannot exhaust the runner's disk.
      - name: Download APK
        uses: actions/download-artifact@v4
        with:
          name: package-android
          path: staging

      # Every desktop archive (Linux, Windows, macOS) plus the Windows
      # installer is packaged on the runners that produced it, then gathered
      # here — this job only adds the Android APK.
      - name: Download Linux package
        uses: actions/download-artifact@v4
        with:
          name: package-linux
          path: staging

      - name: Download Windows package
        uses: actions/download-artifact@v4
        with:
          name: package-windows
          path: staging

      - name: Download macOS package
        uses: actions/download-artifact@v4
        with:
          name: package-macos
          path: staging

      - name: Download Windows installer
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: staging

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: staging/*

      - name: List what will be published
        run: ls -lh staging/

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Everything was downloaded into staging/, so publishing it publishes
          # exactly what was listed there.
          files: |
            staging/*
