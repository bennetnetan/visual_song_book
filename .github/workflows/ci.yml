name: CI

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:

jobs:
  analyze-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            mdbtools

      - name: Check formatting (non-blocking)
        run: dart format --output=none --set-exit-if-changed lib test tool
        continue-on-error: true

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

  build:
    needs: analyze-test
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux
            command: flutter build linux --release
          - os: windows-latest
            name: windows
            command: flutter build windows --release
          - os: macos-latest
            name: macos
            command: flutter build macos --release
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build deps
        if: matrix.name == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            mdbtools

      - name: Build
        run: ${{ matrix.command }}

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-${{ matrix.name }}
          path: build/${{ matrix.name }}/release/bundle
          if-no-files-found: warn

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev \
            mdbtools

      # NOTE: Android release builds currently use Flutter's default debug
      # signing. Configure a keystore and wire up signConfig + the
      # ANDROID_SIGNING_KEY/STOREPASS secrets to produce a signed APK/AAB.
      - name: Build Android APK (release)
        run: flutter build apk --release

      - name: Build Linux (release)
        run: flutter build linux --release

      - name: Package Linux build
        run: tar -czf visual_song_book-linux-x64.tar.gz -C build/linux/x64/release/bundle .

      - name: Upload release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-builds
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            visual_song_book-linux-x64.tar.gz

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            visual_song_book-linux-x64.tar.gz
